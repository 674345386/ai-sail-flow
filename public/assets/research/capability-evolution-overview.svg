      .muted{fill:#7b8077}.small{font-size:19px}.label{font-size:29px;font-weight:500}.rule{stroke:#c8cdc2;stroke-width:2;fill:none}.wire{stroke:#8b998a;stroke-width:2;fill:none}.panel{fill:#fbfaf6;stroke:#cecec2;stroke-width:1.5}
