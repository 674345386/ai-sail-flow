<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Sail Flow 登录验证码</title></head>
<body style="margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#202124">
  <main style="max-width:480px;margin:32px auto;padding:32px;background:#fff;border-radius:12px">
    <h1 style="font-size:22px;margin:0 0 20px">登录 AI-Sail Flow</h1>
    <p>你的邮箱验证码：</p>
    <p style="font-size:32px;font-weight:700;letter-spacing:8px;margin:24px 0">{{ .Token }}</p>
    <p>验证码在 10 分钟内有效。请在 AI-Sail Flow 中输入验证码完成登录。</p>
    <p style="font-size:13px;color:#6b7280">若不是你本人发起，请忽略这封邮件。请勿向他人透露验证码。</p>
  </main>
</body>
</html>
