<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sail Studio product shell preview</title>
<link rel="stylesheet" href="./studio.css"/>
<style>body{margin:0}</style></head>
<body>
<div class="studio-shell">
  <aside class="studio-nav">
    <button class="studio-brand"><span class="studio-brand-mark">▣</span><span><strong>爆款工作室</strong><small>AI-SAIL STUDIO</small></span></button>
    <div class="studio-nav-section">模块</div>
    <button class="studio-nav-item active">商品套图</button>
    <button class="studio-nav-item">爆款雷达</button>
    <button class="studio-nav-item">TVC 成片</button>
    <button class="studio-nav-item">热片复刻</button>
  </aside>
  <div class="studio-main">
    <header class="studio-topbar"><div class="studio-crumbs"><span>爆款工作室</span><span>/</span><strong>商品套图</strong></div><span class="studio-badge">AI-Sail Studio</span></header>
    <div class="studio-content">
      <div class="studio-stack">
        <div class="studio-hero"><div><div class="eyebrow">MODULE A / 商品套图</div><h1>几秒生成主图 / 卖点 / 场景 / KV</h1><p>上传产品参考图并填写简述后生成四类套图。</p></div></div>
        <section class="studio-panel"><div class="studio-panel-heading"><h2>创意生成</h2></div>
          <label class="field"><span class="field-label">项目名称</span><input class="input" value="夏季上新主图包"/></label>
          <div style="margin-top:12px"><button class="btn primary">生成创意图</button></div>
        </section>
      </div>
    </div>
  </div>
</div>
</body></html>
